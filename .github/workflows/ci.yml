name: CI - Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test-and-build:
    name: Desktop Test & PyInstaller Build
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install pytest pytest-asyncio pyinstaller pillow qrcode opencv-python

      - name: Run Desktop Test Suite
        run: |
          python -m pytest -v

      - name: Build Windows Executable
        run: |
          python -m PyInstaller build_exe.spec --clean --noconfirm

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalClipboard-Windows
          path: dist/UniversalClipboard.exe

  android-build:
    name: Android Debug APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalClipboard-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
